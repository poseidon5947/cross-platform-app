<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Crew+ — People & Performance</title>
<style>
  :root{
    --brand:#1c5cab; --brand-2:#2a78d6; --brand-deep:#0f3a70;
    --aqua:#12a37a; --aqua-soft:#e2f5ee;
    --page:#eef1f4; --card:#ffffff; --card-2:#f7f9fb;
    --ink:#0d1b2a; --ink-2:#52606d; --muted:#8a94a1;
    --line:#e6eaef; --line-2:#eef1f4;
    --good:#0ca30c; --good-soft:#e5f5e5;
    --warn:#e79a00; --warn-soft:#fdf1da;
    --serious:#ec835a; --serious-soft:#fcebe2;
    --crit:#d03b3b; --crit-soft:#fbe6e6;
    --gold:#e0a100;
    --shadow:0 1px 2px rgba(13,27,42,.06),0 4px 16px rgba(13,27,42,.06);
    --shadow-lg:0 10px 40px rgba(13,27,42,.16);
    --r:16px; --r-sm:11px;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:linear-gradient(160deg,#dfe6ee,#c9d5e2);min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 12px 40px;color:var(--ink)}

  /* ---- role switcher ---- */
  .rolebar{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.75);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.6);padding:7px 8px 7px 16px;border-radius:999px;box-shadow:var(--shadow);position:sticky;top:8px;z-index:50}
  .rolebar .lbl{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
  .seg{display:flex;background:#e7ecf2;border-radius:999px;padding:3px}
  .seg button{border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);padding:7px 15px;border-radius:999px;cursor:pointer;transition:.18s}
  .seg button.on{background:var(--brand);color:#fff;box-shadow:0 2px 6px rgba(28,92,171,.4)}

  /* ---- phone ---- */
  .phone{width:392px;max-width:100%;height:812px;background:var(--page);border-radius:44px;box-shadow:var(--shadow-lg),0 0 0 11px #10161d,0 0 0 13px #2a333d;overflow:hidden;position:relative;display:flex;flex-direction:column}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:30px;background:#10161d;border-radius:0 0 18px 18px;z-index:40}
  .statusbar{height:46px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-size:13px;font-weight:600;color:#fff;position:relative;z-index:5}
  .statusbar.dark-ink{color:var(--ink)}
  .statusbar .r{display:flex;gap:6px;align-items:center;font-size:12px}

  /* ---- app header ---- */
  .apphead{flex:none;padding:2px 20px 18px;background:linear-gradient(150deg,var(--brand-deep),var(--brand) 60%,var(--brand-2));color:#fff;position:relative;overflow:hidden}
  .apphead::after{content:"";position:absolute;right:-40px;top:-60px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%)}
  .apphead .eyebrow{font-size:12px;font-weight:600;opacity:.8;letter-spacing:.04em;text-transform:uppercase}
  .apphead h1{font-size:23px;font-weight:750;margin-top:3px;letter-spacing:-.01em}
  .apphead .sub{font-size:13px;opacity:.85;margin-top:3px}
  .avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;color:#fff;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.2)}
  .headrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:relative;z-index:2}

  /* ---- scroll body ---- */
  .screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 96px;-webkit-overflow-scrolling:touch}
  .screen::-webkit-scrollbar{width:0}
  .view{display:none;animation:fade .28s ease}
  .view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---- cards & bits ---- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
  .card.tap{cursor:pointer;transition:.15s}
  .card.tap:active{transform:scale(.985)}
  .sect{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:20px 4px 10px;display:flex;justify-content:space-between;align-items:center}
  .sect:first-child{margin-top:4px}
  .row{display:flex;align-items:center;gap:12px}
  .row.sb{justify-content:space-between}
  .grow{flex:1;min-width:0}
  .muted{color:var(--muted)}.ink2{color:var(--ink-2)}
  .b{font-weight:700}.sb{font-weight:600}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:4px 9px;border-radius:999px;white-space:nowrap}
  .pill.good{background:var(--good-soft);color:#0a7d0a}
  .pill.warn{background:var(--warn-soft);color:#a06a00}
  .pill.serious{background:var(--serious-soft);color:#b8552f}
  .pill.crit{background:var(--crit-soft);color:#b32424}
  .pill.brand{background:#e7f0fb;color:var(--brand)}
  .pill.aqua{background:var(--aqua-soft);color:#0b7a5b}
  .pill.gold{background:#fbf1cf;color:#8a6a00}
  .pill.lock{background:#eceef1;color:#5a6472}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;font:inherit;font-weight:650;font-size:14px;padding:12px 16px;border-radius:12px;cursor:pointer;transition:.15s;width:100%}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--brand);color:#fff;box-shadow:0 3px 10px rgba(28,92,171,.32)}
  .btn.ghost{background:var(--card-2);color:var(--brand);border:1px solid var(--line)}
  .btn.aqua{background:var(--aqua);color:#fff;box-shadow:0 3px 10px rgba(18,163,122,.3)}
  .btn.sm{padding:8px 13px;font-size:12.5px;width:auto;border-radius:10px}

  .bar{height:8px;border-radius:6px;background:var(--line-2);overflow:hidden}
  .bar>span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--brand-2),var(--brand))}
  .bar.aqua>span{background:linear-gradient(90deg,#2fc79a,var(--aqua))}
  .bar.warn>span{background:linear-gradient(90deg,#f6c25a,var(--warn))}

  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;box-shadow:var(--shadow)}
  .stat .n{font-size:25px;font-weight:760;letter-spacing:-.02em;line-height:1}
  .stat .k{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:5px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}

  .hero{background:linear-gradient(140deg,#123a6d,#1c5cab);color:#fff;border-radius:var(--r);padding:17px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
  .hero::after{content:"";position:absolute;right:-30px;bottom:-50px;width:150px;height:150px;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%)}
  .value-chip{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);padding:5px 11px;border-radius:999px;font-size:12px;font-weight:650;margin-bottom:10px}

  .listitem{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-2)}
  .listitem:last-child{border-bottom:0}
  .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none}

  .check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;cursor:pointer;transition:.18s;color:transparent;font-size:14px}
  .check.done{background:var(--aqua);border-color:var(--aqua);color:#fff}
  .ritual.done .rt{text-decoration:line-through;color:var(--muted)}

  .tabs{display:flex;gap:6px;background:var(--card-2);border:1px solid var(--line);padding:4px;border-radius:12px;margin-bottom:14px;overflow-x:auto}
  .tabs button{flex:1;white-space:nowrap;border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:650;color:var(--ink-2);padding:8px 10px;border-radius:9px;cursor:pointer}
  .tabs button.on{background:#fff;color:var(--brand);box-shadow:var(--shadow)}
  .subview{display:none}.subview.on{display:block}

  .lb{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2)}
  .lb:last-child{border-bottom:0}
  .rank{width:26px;text-align:center;font-weight:750;color:var(--muted)}
  .rank.g1{color:var(--gold)}.rank.g2{color:#9aa3ad}.rank.g3{color:#c08457}
  .lb.me{background:#eef5ff;margin:0 -8px;padding:11px 8px;border-radius:10px;border-bottom:0}

  .timeline{position:relative;padding-left:22px}
  .timeline::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
  .tl{position:relative;padding:0 0 16px}
  .tl:last-child{padding-bottom:0}
  .tl::before{content:"";position:absolute;left:-19px;top:4px;width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid var(--brand-2)}
  .tl.pos::before{border-color:var(--aqua)}
  .tl.warnd::before{border-color:var(--warn)}

  .confidential{background:repeating-linear-gradient(45deg,#faf3f3,#faf3f3 10px,#f7ecec 10px,#f7ecec 20px);border:1px dashed #e3b7b7}
  .rate{display:flex;gap:5px}
  .rate span{width:22px;height:22px;border-radius:6px;background:var(--line-2);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
  .rate span.on{background:var(--brand);color:#fff}

  /* bottom nav */
  .nav{position:absolute;bottom:0;left:0;right:0;height:80px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:9px 6px 20px;z-index:30}
  .nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--muted);font-size:10.5px;font-weight:650}
  .nav button .ni{font-size:21px;line-height:1}
  .nav button.on{color:var(--brand)}
  .navset{display:none}.navset.on{display:flex}

  .toast{position:absolute;left:50%;bottom:98px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.3s;z-index:60;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .fabnote{font-size:12px;color:var(--ink-2);background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.5}
  .caption{max-width:392px;text-align:center;font-size:12.5px;color:#41506180;color:#495a6b;line-height:1.5;padding:0 6px}
  .modhint{font-size:11px;color:var(--muted);margin-top:2px}
  .badge-tile{aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);background:var(--card);text-align:center;padding:6px}
  .badge-tile .be{font-size:26px}
  .badge-tile.lock{opacity:.42;filter:grayscale(.4)}
  .badge-tile .bt{font-size:10px;font-weight:650;color:var(--ink-2);line-height:1.15}
  a{color:var(--brand);text-decoration:none}
</style>
</head>
<body>

<div class="rolebar">
  <span class="lbl">Viewing as</span>
  <div class="seg">
    <button id="roleCrew" class="on" onclick="setRole('crew')">👷 Crew</button>
    <button id="roleMgr" onclick="setRole('mgr')">🧭 Manager / Admin</button>
  </div>
</div>

<div class="phone">
  <div class="notch"></div>
  <div class="statusbar"><span>9:41</span><span class="r">✦ 5G &nbsp; 100%▮</span></div>

  <!-- HEADER -->
  <div class="apphead">
    <div class="headrow">
      <div>
        <div class="eyebrow" id="hEyebrow">Good morning</div>
        <h1 id="hTitle">Jesse</h1>
        <div class="sub" id="hSub">Technician · Waterproofing crew</div>
      </div>
      <div class="avatar" id="hAvatar" style="background:linear-gradient(135deg,#2fc79a,#12a37a)">JE</div>
    </div>
  </div>

  <div class="screen" id="screen"><!-- views injected --></div>

  <div class="toast" id="toast"></div>

  <!-- NAV: crew -->
  <div class="nav navset on" id="navCrew">
    <button class="on" data-v="c-home"><span class="ni">🏠</span>Home</button>
    <button data-v="c-values"><span class="ni">🎯</span>Values</button>
    <button data-v="c-growth"><span class="ni">📈</span>Growth</button>
    <button data-v="c-rewards"><span class="ni">🏆</span>Rewards</button>
  </div>
  <!-- NAV: manager -->
  <div class="nav navset" id="navMgr">
    <button class="on" data-v="m-team"><span class="ni">👥</span>Team</button>
    <button data-v="m-reviews"><span class="ni">📝</span>Reviews</button>
    <button data-v="m-comply"><span class="ni">🛡️</span>Compliance</button>
    <button data-v="m-rewards"><span class="ni">🏆</span>Rewards</button>
    <button data-v="m-more"><span class="ni">⚙️</span>More</button>
  </div>
</div>

<p class="caption" id="caption">Prototype · tap around and switch roles up top. Marking value rituals done banks points and grows the streak; logging a Google review awards points; open a team member to see their profile. Sample data only.</p>

<script>
// ---------------- state ----------------
const state = {
  role:'crew',
  points:1240,
  streak:6,
  rituals:{daily:false, weekly:false, monthly:false},
  // Real crew + real certifications from the audit worksheet. status: good | warn | crit | audit
  crew:[
    {id:'jesse',name:'Jesse',init:'JE',color:'#12a37a',role:'Technician',pts:1240,me:true,reviewIn:9,kpi:84,bday:null,office:false,
      certs:[
        {label:'WHMIS',status:'audit',note:'Active · date needed'},
        {label:'Hearing',status:'audit',note:'Active · date needed'},
        {label:'Level 1 First Aid',status:'crit',note:'Expired · renew now'},
        {label:'Fit Test',status:'warn',note:'Tested Sep 2025 · likely overdue'},
        {label:'Lift',status:'audit',note:'Active · date needed'},
      ]},
    {id:'shane',name:'Shane',init:'SH',color:'#2a78d6',role:'Technician',pts:1610,reviewIn:12,kpi:88,bday:'Thu',office:false,
      certs:[
        {label:'Lift Operation',status:'audit',note:'Active · date needed'},
      ], flag:'Only 1 cert on file'},
    {id:'jon',name:'Jon',init:'JO',color:'#eb6834',role:'Technician',pts:980,reviewIn:34,kpi:90,bday:null,office:false,
      certs:[
        {label:'Lift Operation',status:'audit',note:'Active · date needed'},
        {label:'Level 1 First Aid',status:'good',note:'Current · exp Feb 2028'},
        {label:'Fit Test',status:'audit',note:'Active · date needed'},
        {label:'Confined Spaces',status:'audit',note:'Active · date needed'},
      ]},
    {id:'josh',name:'Josh',init:'JH',color:'#4a3aa7',role:'Technician',pts:640,reviewIn:16,kpi:79,bday:null,office:false,
      certs:[
        {label:'Fall Arrest',status:'audit',note:'Active · date needed'},
        {label:'Lift',status:'audit',note:'Active · date needed'},
        {label:'Confined Spaces',status:'audit',note:'Active · date needed'},
      ]},
    {id:'logan',name:'Logan',init:'LO',color:'#e87ba4',role:'Technician',pts:410,reviewIn:22,kpi:70,bday:null,office:false,
      certs:[], flag:'No certs on file — full audit needed'},
    {id:'thorpe',name:'Thorpe',init:'TH',color:'#1baf7a',role:'Technician',pts:1305,reviewIn:48,kpi:91,bday:null,office:false,
      certs:[
        {label:'Lift Operation',status:'audit',note:'Active · date needed'},
        {label:'Level 1 First Aid',status:'good',note:'Current · exp Feb 2028'},
        {label:'Fit Test',status:'audit',note:'Active · date needed'},
        {label:'Confined Spaces',status:'audit',note:'Active · date needed'},
      ]},
    {id:'rogers',name:'Rogers',init:'RO',color:'#eda100',role:'Technician',pts:1120,reviewIn:6,kpi:86,bday:null,office:false,
      certs:[
        {label:'Level 1 First Aid',status:'good',note:'Current · exp Feb 2028'},
        {label:'Fit Test',status:'audit',note:'Active · date needed'},
      ]},
    {id:'crewlead',name:'Crew Lead',init:'CL',color:'#0f3a70',role:'Crew Lead · Field manager',pts:1740,reviewIn:28,kpi:92,bday:null,office:false,
      certs:[
        {label:'Lift Operation',status:'audit',note:'Active · date needed'},
        {label:'Level 1 First Aid',status:'audit',note:'Active · date needed'},
        {label:'Confined Spaces',status:'audit',note:'Active · date needed'},
      ], addNote:'Name to confirm · +1 technician to add'},
    {id:'ops',name:'Operations',init:'OP',color:'#256abf',role:'Ops · Marketing · Accounting',pts:870,reviewIn:40,kpi:88,bday:null,office:true,certs:[]},
    {id:'cfo',name:'CFO',init:'CF',color:'#52606d',role:'Finance · owns bonus pool',pts:520,reviewIn:55,kpi:90,bday:null,office:true,certs:[]},
    {id:'ceo',name:'CEO',init:'CE',color:'#4a3aa7',role:'Owner',pts:600,reviewIn:60,kpi:0,bday:null,office:true,certs:[]},
  ],
  rewards:[
    {t:'Cash - $50',c:200,e:'$'},
    {t:'Cash - $100',c:400,e:'$'},
    {t:'Gift Card - $50',c:200,e:'GC'},
    {t:'Gift Card - $100',c:400,e:'GC'},
    {t:'PTO - half day',c:800,e:'PTO'},
    {t:'PTO - full day',c:1600,e:'PTO'},
  ],
};
const VALUES = [
  {v:'Safety First, Always', color:'#d03b3b'},
  {v:'Do It Right the First Time', color:'#1c5cab'},
  {v:'Own the Outcome', color:'#12a37a'},
  {v:'Leave It Better', color:'#eb6834'},
  {v:'Grow the Crew', color:'#4a3aa7'},
];

// ---------------- helpers ----------------
const $=(s,r=document)=>r.querySelector(s);
const el=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;};
function toast(msg){const t=$('#toast');t.innerHTML=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1900);}
function addPts(n,msg){state.points+=n;state.crew.find(c=>c.me).pts+=n;toast(`✨ +${n} pts · ${msg}`);render();}

const STATUS_ORDER={crit:0,warn:1,audit:2,good:3};
function statusPillCls(s){return {good:'good',warn:'warn',crit:'crit',audit:'lock'}[s];}
// most urgent cert for the roster chip
function topCert(c){
  if(!c.certs || !c.certs.length) return {label:'No certs', status:'crit', note:''};
  return [...c.certs].sort((a,b)=>STATUS_ORDER[a.status]-STATUS_ORDER[b.status])[0];
}
function certChip(cert){
  const short=cert.status==='crit'?'Action':cert.status==='warn'?'Renew soon':cert.status==='audit'?'Date needed':'Current';
  return `<span class="pill ${statusPillCls(cert.status)}">${cert.label} · ${short}</span>`;
}

// ---------------- CREW VIEWS ----------------
function crewHome(){
  const val=VALUES[1];
  return `
  <div class="hero">
    <span class="value-chip">🎯 Today's value focus</span>
    <div style="font-size:19px;font-weight:750;letter-spacing:-.01em">${val.v}</div>
    <div style="font-size:13px;opacity:.9;margin-top:6px;line-height:1.45">Before you leave a stage, ask: “Would I be happy to inspect this myself?” Log one thing you did right the first time today.</div>
    <div class="row" style="margin-top:14px;gap:10px">
      <button class="btn aqua" style="flex:1" onclick="markRitual('daily',this)">${state.rituals.daily?'✓ Logged today':'Mark done · +30'}</button>
    </div>
  </div>

  <div class="grid3" style="margin-top:14px">
    <div class="stat"><div class="n" style="color:var(--brand)">${state.points.toLocaleString()}</div><div class="k">My points</div></div>
    <div class="stat"><div class="n">🔥 ${state.streak}</div><div class="k">Day streak</div></div>
    <div class="stat"><div class="n">84%</div><div class="k">KPIs on track</div></div>
  </div>

  <div class="sect">This week</div>
  <div class="card tap" onclick="go('c-growth')">
    <div class="row sb"><div class="row"><div class="ico" style="background:#e7f0fb">📅</div><div><div class="b">Quarterly check-in</div><div class="muted" style="font-size:12.5px">with the Crew Lead · in 9 days</div></div></div><span class="pill brand">Q3 review</span></div>
  </div>
  <div class="card tap" onclick="go('c-values');subgo('sw')">
    <div class="row sb"><div class="row"><div class="ico" style="background:#efeafb">🧭</div><div><div class="b">Quarterly SWOT due</div><div class="muted" style="font-size:12.5px">5-minute self-reflection · feeds your review</div></div></div><span class="pill warn">Do it</span></div>
  </div>
  <div class="card tap" onclick="go('c-growth');subgo('certs')">
    <div class="row sb"><div class="row"><div class="ico" style="background:#fbe6e6">🩹</div><div><div class="b">Level 1 First Aid expired</div><div class="muted" style="font-size:12.5px">renew now · required on site</div></div></div><span class="pill crit">Act</span></div>
  </div>

}

  const sorted=[...state.crew].sort((a,b)=>b.pts-a.pts);
  return `
  <div class="sect">Recognize great work</div>
  <div class="card">
    <div class="row sb" style="margin-bottom:12px"><div class="row"><div class="ico" style="background:#e2f5ee;font-size:19px">⭐</div><div><div class="b">Log a glowing review</div><div class="muted" style="font-size:12px">Google or customer · awards points to the crew named</div></div></div></div>
    <button class="btn aqua" onclick="logReview()">+ Log 5★ review · award +200</button>
  </div>
  <div class="card">
    <div class="row sb"><div class="row"><div class="ico" style="background:#e7f0fb;font-size:19px">🎁</div><div><div class="b">Award bonus points</div><div class="muted" style="font-size:12px">Hit a goal, safety milestone, extra effort</div></div></div>
    <button class="btn ghost sm" onclick="addPts(100,'Bonus points awarded to Jesse')">+100</button></div>
  </div>

  <div class="sect">Leaderboard · company</div>
  <div class="card">
    ${sorted.map((c,i)=>`<div class="lb"><div class="rank ${i<3?'g'+(i+1):''}">${i<3?['🥇','🥈','🥉'][i]:i+1}</div><div class="avatar" style="width:34px;height:34px;font-size:12px;background:${c.color}">${c.init}</div><div class="grow b" style="font-size:13.5px">${c.name}</div><div class="b" style="color:var(--brand)">${c.pts.toLocaleString()}</div></div>`).join('')}
  </div>
  <div class="fabnote">Points are one shared wallet with Waterproofing+ — perfect truck-task days and glowing reviews both feed this board.</div>`;
}

function mgrMore(){
  const item=(e,t,s)=>`<div class="listitem"><div class="ico" style="background:var(--card-2)">${e}</div><div class="grow"><div class="b" style="font-size:13.5px">${t}</div><div class="muted" style="font-size:12px">${s}</div></div><div class="muted">›</div></div>`;
  return `
  <div class="sect">Cadence & nudge engine</div>
  <div class="card">
    ${item('🗓️','Recurring nudges','Daily value · weekly exercise · monthly ritual')}
    ${item('🧭','Quarterly SWOT + feedback form','Auto-sent before reviews')}
    ${item('🎂','Birthdays & work anniversaries','Auto reminders to managers')}
    ${item('🔔','Push & email digests','Web push + manager weekly email')}
  </div>
  <div class="sect">Configure</div>
  <div class="card">
    ${item('🎯','Company values & exercises','4 values · edit rituals')}
    ${item('📊','KPI templates by role','Set targets per role')}
    ${item('🏆','Rewards catalog','5 rewards · point costs')}
    ${item('👤','Roles & access','Crew · Manager · Admin')}
  </div>
  <div class="sect">Reports</div>
  <div class="card">
    <button class="btn ghost" style="margin-bottom:10px" onclick="toast('📄 Review summary exported (sample)')">Export review summary (PDF/CSV)</button>
    <button class="btn ghost" style="margin-bottom:10px" onclick="toast('📄 Compliance report exported (sample)')">Export compliance report</button>
    <button class="btn ghost" onclick="toast('📄 Bonus report exported — admin only')">Export bonus report 🔒</button>
  </div>`;
}

// ---------------- router ----------------
const VIEWS={
  'c-home':crewHome,'c-values':crewValues,'c-growth':crewGrowth,'c-rewards':crewRewards,
  'm-team':mgrTeam,'m-reviews':mgrReviews,'m-comply':mgrComply,'m-rewards':mgrRewards,'m-more':mgrMore,
};
let current = 'c-home';
let memberOpen = null;

function render(){
  const scr=$('#screen');
  let html;
  if(memberOpen){ html = mgrMember(memberOpen); }
  else { html = VIEWS[current](); }
  scr.innerHTML = `<div class="view on">${html}</div>`;
  scr.scrollTop=0;
  bindSub();
}
function go(v){
  memberOpen=null; current=v;
  const navset = state.role==='crew'?'#navCrew':'#navMgr';
  document.querySelectorAll(navset+' button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  render();
}
function openMember(id){ memberOpen=id; render(); updateHeaderForMember(id); }

function bindSub(){
  document.querySelectorAll('.tabs').forEach(tabs=>{
    tabs.querySelectorAll('button').forEach(b=>{
      b.onclick=()=>{
        tabs.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
        b.classList.add('on');
        const host=tabs.parentElement;
        host.querySelectorAll('.subview').forEach(sv=>sv.classList.toggle('on',sv.dataset.sv===b.dataset.sv));
      };
    });
  });
}
function subgo(sv){ // jump to a subtab after navigating
  setTimeout(()=>{const b=document.querySelector(`.tabs button[data-sv="${sv}"]`)||document.querySelector(`#${sv}`); if(b&&b.click)b.click(); else if(b)b.scrollIntoView({behavior:'smooth'});},60);
}

// nav wiring
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.v)));

// ---------------- header + role ----------------
function setRole(r){
  state.role=r; memberOpen=null;
  $('#roleCrew').classList.toggle('on',r==='crew');
  $('#roleMgr').classList.toggle('on',r==='mgr');
  $('#navCrew').classList.toggle('on',r==='crew');
  $('#navMgr').classList.toggle('on',r==='mgr');
  if(r==='crew'){ current='c-home'; setHeader('Good morning','Jesse','Technician · Waterproofing crew','JE','linear-gradient(135deg,#2fc79a,#12a37a)'); }
  else { current='m-team'; setHeader('Admin view','Operations','Ops / Marketing / Accounting · 12 people','OP','linear-gradient(135deg,#4a3aa7,#2a78d6)'); }
  document.querySelectorAll('.navset.on button').forEach((b,i)=>b.classList.toggle('on',i===0));
  render();
}
function setHeader(eye,title,sub,init,grad){
  $('#hEyebrow').textContent=eye; $('#hTitle').textContent=title; $('#hSub').textContent=sub;
  const a=$('#hAvatar'); a.textContent=init; a.style.background=grad;
}
function updateHeaderForMember(id){
  const c=state.crew.find(x=>x.id===id);
  setHeader('Team member',c.name,c.role,c.init,`linear-gradient(135deg,${c.color},${c.color})`);
}

// ---------------- interactions ----------------
const RITUAL_PTS={daily:30,weekly:40,monthly:60};
function markRitual(k,btn){
  if(state.rituals[k]) return;
  state.rituals[k]=true;
  if(k==='daily'&&!state._streakBumped){ state.streak++; state._streakBumped=true; }
  addPts(RITUAL_PTS[k], k[0].toUpperCase()+k.slice(1)+' ritual done');
}
function redeem(i){
  const r=state.rewards[i];
  if(state.points<r.c)return;
  state.points-=r.c; state.crew.find(c=>c.me).pts-=r.c;
  toast(`🎉 Redeemed: ${r.t}`); render();
}
function logReview(){
  state.crew.find(c=>c.me).pts+=200; state.points+=200;
  toast('⭐ 5★ review logged · +200 to the crew'); render();
}

// boot
render();
</script>
</body>
</html>
