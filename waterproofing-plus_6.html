<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b3d61">
<title>Waterproofing+ · Warehouse & Crew Ops</title>
<style>
  :root{
    --bg:#0e1726;            /* app shell */
    --surface:#ffffff;
    --surface-2:#f4f7fb;
    --surface-3:#e9eef5;
    --ink:#132135;
    --ink-2:#5a6b82;
    --ink-3:#8a99ad;
    --line:#e2e8f1;
    --primary:#0b6ea8;       /* water blue */
    --primary-d:#0b3d61;     /* deep below-grade */
    --accent:#12b3a6;        /* teal */
    --good:#1f9d63;
    --good-bg:#e4f6ec;
    --warn:#c9820a;
    --warn-bg:#fdf2dc;
    --bad:#d0453b;
    --bad-bg:#fbe7e5;
    --purple:#6b57d4;
    --radius:16px;
    --shadow:0 2px 10px rgba(19,33,53,.07);
    --shadow-lg:0 10px 30px rgba(11,61,97,.16);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;line-height:1.45;
    overscroll-behavior-y:none;
  }
  .app{
    max-width:480px;margin:0 auto;min-height:100vh;
    background:var(--surface-2);position:relative;
    display:flex;flex-direction:column;
  }
  /* ---------- Header ---------- */
  header.top{
    background:linear-gradient(135deg,var(--primary-d),var(--primary));
    color:#fff;padding:14px 18px 16px;position:sticky;top:0;z-index:40;
    box-shadow:0 4px 14px rgba(11,61,97,.28);
  }
  .brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px}
  .logo{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.16);
    display:grid;place-items:center;flex:0 0 auto}
  .logo svg{width:18px;height:18px}
  .brand small{display:block;font-weight:500;font-size:11px;opacity:.8;letter-spacing:.3px}
  .whoami{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);
    border:0;color:#fff;padding:6px 10px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}
  .whoami .av{width:22px;height:22px;border-radius:50%;background:var(--accent);
    display:grid;place-items:center;font-size:11px;font-weight:700;color:#04302c}
  .htitle{font-size:20px;font-weight:800;margin:12px 2px 2px}
  .hsub{font-size:12.5px;opacity:.82;margin:0 2px}
  /* ---------- Scroll area ---------- */
  main{flex:1;overflow-y:auto;padding:16px 16px calc(96px + var(--safe-b));-webkit-overflow-scrolling:touch}
  .view{display:none;animation:fade .22s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  /* ---------- Cards / generic ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
  .card h3{margin:0 0 2px;font-size:15px}
  .sec-h{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 10px}
  .sec-h h2{font-size:16px;margin:0;font-weight:800;letter-spacing:.2px}
  .sec-h .link{color:var(--primary);font-size:13px;font-weight:600;background:0;border:0;cursor:pointer}
  .muted{color:var(--ink-2)}
  .tiny{font-size:12px}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
    padding:3px 9px;border-radius:999px;line-height:1.4}
  .pill.good{background:var(--good-bg);color:var(--good)}
  .pill.warn{background:var(--warn-bg);color:var(--warn)}
  .pill.bad{background:var(--bad-bg);color:var(--bad)}
  .pill.neu{background:var(--surface-3);color:var(--ink-2)}
  /* ---------- KPI grid ---------- */
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;box-shadow:var(--shadow)}
  .kpi .k-lab{font-size:11.5px;color:var(--ink-2);font-weight:600;display:flex;align-items:center;gap:6px}
  .kpi .k-val{font-size:24px;font-weight:800;margin-top:4px;letter-spacing:-.5px}
  .kpi .k-sub{font-size:11px;color:var(--ink-3);margin-top:1px}
  .kpi.alert .k-val{color:var(--bad)}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:transform .06s ease,filter .15s}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--primary);color:#fff}
  .btn.dark{background:var(--primary-d);color:#fff}
  .btn.ghost{background:var(--surface-3);color:var(--ink)}
  .btn.line{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
  .btn.block{width:100%}
  .btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
  .btn.good{background:var(--good);color:#fff}
  .btn.danger{background:var(--bad);color:#fff}
  .btn[disabled]{opacity:.5;pointer-events:none}
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safe-b));
    z-index:45;background:var(--accent);color:#04302c;box-shadow:var(--shadow-lg);
    max-width:480px;width:calc(100% - 32px)}
  /* ---------- Inventory list ---------- */
  .search{display:flex;gap:8px;margin-bottom:12px}
  .search input{flex:1;border:1px solid var(--line);border-radius:12px;padding:11px 13px;
    font-size:15px;font-family:inherit;background:#fff}
  .search input:focus{outline:2px solid var(--primary);border-color:transparent}
  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:#fff;border:1.5px solid var(--line);border-radius:999px;
    padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--primary-d);border-color:var(--primary-d);color:#fff}
  .inv{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
  .inv:last-child{border-bottom:0}
  .inv .ic{width:42px;height:42px;border-radius:11px;background:var(--surface-2);
    display:grid;place-items:center;flex:0 0 auto;font-size:18px}
  .inv .mid{flex:1;min-width:0}
  .inv .nm{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .inv .meta{font-size:11.5px;color:var(--ink-3);margin-top:1px}
  .inv .qtywrap{text-align:right;flex:0 0 auto}
  .inv .qty{font-weight:800;font-size:16px}
  .bar{height:6px;border-radius:99px;background:var(--surface-3);margin-top:6px;overflow:hidden;width:100%}
  .bar > i{display:block;height:100%;border-radius:99px}
  /* ---------- Cart / log ---------- */
  .line-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .line-item:last-child{border-bottom:0}
  .qtybox{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
  .qtybox button{width:34px;height:34px;border:0;background:var(--surface-2);font-size:19px;font-weight:700;color:var(--primary);cursor:pointer}
  .qtybox input{width:44px;height:34px;border:0;text-align:center;font-size:15px;font-weight:700;font-family:inherit;background:#fff}
  .qtybox input:focus{outline:none}
  /* ---------- Checklist ---------- */
  .seg{display:flex;background:var(--surface-3);border-radius:12px;padding:4px;margin-bottom:14px}
  .seg button{flex:1;border:0;background:0;padding:10px;border-radius:9px;font-size:14px;font-weight:700;color:var(--ink-2);cursor:pointer;font-family:inherit}
  .seg button.on{background:#fff;color:var(--primary-d);box-shadow:var(--shadow)}
  .task{display:flex;align-items:center;gap:13px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
  .task:last-child{border-bottom:0}
  .cbx{width:26px;height:26px;border-radius:8px;border:2px solid var(--ink-3);flex:0 0 auto;
    display:grid;place-items:center;transition:.15s}
  .cbx svg{width:15px;height:15px;stroke:#fff;opacity:0}
  .task.done .cbx{background:var(--good);border-color:var(--good)}
  .task.done .cbx svg{opacity:1}
  .task.done .tk-txt{color:var(--ink-3);text-decoration:line-through}
  .tk-txt{font-size:14.5px;font-weight:600}
  .ring-wrap{display:flex;align-items:center;gap:16px}
  .ring{--p:0;width:78px;height:78px;border-radius:50%;flex:0 0 auto;
    background:conic-gradient(var(--good) calc(var(--p)*1%),var(--surface-3) 0);
    display:grid;place-items:center;position:relative}
  .ring::after{content:"";position:absolute;inset:8px;border-radius:50%;background:#fff}
  .ring b{position:relative;z-index:1;font-size:19px;font-weight:800}
  /* ---------- Leaderboard ---------- */
  .lb{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
  .lb:last-child{border-bottom:0}
  .rank{width:26px;text-align:center;font-weight:800;color:var(--ink-3)}
  .rank.top{color:var(--warn)}
  .av-lg{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:0 0 auto}
  .pts{margin-left:auto;text-align:right}
  .pts b{font-size:16px}
  /* ---------- Activity ---------- */
  .act{display:flex;gap:11px;padding:10px 2px;border-bottom:1px solid var(--line)}
  .act:last-child{border-bottom:0}
  .act .ai{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;font-size:14px}
  .act .atxt{font-size:13px;flex:1}
  .act .atime{font-size:11px;color:var(--ink-3);white-space:nowrap}
  /* ---------- Bottom nav ---------- */
  nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
    background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);
    display:flex;justify-content:space-around;padding:8px 6px calc(8px + var(--safe-b));z-index:50}
  nav.tabs button{background:0;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--ink-3);font-size:10.5px;font-weight:700;cursor:pointer;font-family:inherit;padding:2px 8px;flex:1}
  nav.tabs button svg{width:23px;height:23px;stroke-width:2}
  nav.tabs button.on{color:var(--primary)}
  /* ---------- Modal / sheet ---------- */
  .sheet-bg{position:fixed;inset:0;background:rgba(10,18,30,.5);z-index:60;opacity:0;pointer-events:none;transition:.2s}
  .sheet-bg.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:50%;transform:translateX(-50%) translateY(100%);bottom:0;width:100%;max-width:480px;
    background:var(--surface-2);border-radius:22px 22px 0 0;z-index:61;transition:transform .26s cubic-bezier(.2,.8,.2,1);
    max-height:92vh;display:flex;flex-direction:column;padding-bottom:var(--safe-b)}
  .sheet.open{transform:translateX(-50%) translateY(0)}
  .sheet .grip{width:40px;height:4px;border-radius:99px;background:var(--surface-3);margin:10px auto 4px}
  .sheet .sh-head{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 10px}
  .sheet .sh-head h3{margin:0;font-size:17px}
  .sheet .sh-body{overflow-y:auto;padding:4px 18px 18px}
  .sheet .x{background:var(--surface-3);border:0;width:32px;height:32px;border-radius:50%;font-size:17px;cursor:pointer;color:var(--ink-2)}
  label.fld{display:block;margin:12px 0 6px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
  input.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:12px;
    font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
  input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid var(--primary);border-color:transparent}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + var(--safe-b));
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;
    z-index:80;opacity:0;transition:.25s;box-shadow:var(--shadow-lg);max-width:90%;text-align:center;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
  .empty{text-align:center;color:var(--ink-3);padding:34px 20px;font-size:14px}
  .empty .big{font-size:34px;margin-bottom:8px}
  .selrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .selrow::-webkit-scrollbar{display:none}
  .selrow .sopt{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:11px;
    padding:9px 13px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink-2);white-space:nowrap}
  .selrow .sopt.on{border-color:var(--primary);background:#eef7fc;color:var(--primary-d)}
  /* confetti */
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
  .confetti i{position:absolute;top:-12px;width:9px;height:14px;opacity:.9;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
  .banner{background:linear-gradient(120deg,#12b3a6,#0b6ea8);color:#fff;border-radius:14px;padding:14px;margin-bottom:14px;
    display:flex;align-items:center;gap:12px}
  .banner .bi{font-size:26px}
  .streakflame{font-size:15px}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brandrow">
      <div class="brand">
        <span class="logo">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 2.5c3.5 4.2 6 7.4 6 10.6a6 6 0 1 1-12 0c0-3.2 2.5-6.4 6-10.6Z" fill="#8fd8ff"/><path d="M9.5 13.5a2.5 2.5 0 0 0 2.5 2.5" stroke="#0b3d61" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <div>Waterproofing+<small>Warehouse &amp; Crew Ops</small></div>
      </div>
      <button class="whoami" id="whoBtn"><span class="av" id="whoAv">Y</span><span id="whoName">You</span></button>
    </div>
    <div class="htitle" id="hTitle">Today</div>
    <div class="hsub" id="hSub">Thursday · truck ready, stock in check</div>
  </header>

  <main id="main">
    <!-- ============ HOME / DASHBOARD ============ -->
    <section class="view active" id="view-home"></section>
    <!-- ============ INVENTORY ============ -->
    <section class="view" id="view-inv"></section>
    <!-- ============ LOG USAGE (reached via button) ============ -->
    <section class="view" id="view-log"></section>
    <!-- ============ TOOLS / EQUIPMENT ============ -->
    <section class="view" id="view-tools"></section>
    <!-- ============ TRUCKS / DAILY TASKS ============ -->
    <section class="view" id="view-trucks"></section>
    <!-- ============ CREW / POINTS ============ -->
    <section class="view" id="view-crew"></section>
  </main>

  <nav class="tabs" id="tabs">
    <button data-tab="home" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Home</button>
    <button data-tab="inv">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4Z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>Inventory</button>
    <button data-tab="tools">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4l-6 6a1.5 1.5 0 0 0 2 2l6-6a4 4 0 0 0 5.4-5.4l-2.3 2.3-2-2 2.3-2.3Z"/></svg>Tools</button>
    <button data-tab="trucks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h11v9H3z"/><path d="M14 9h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg>Trucks</button>
    <button data-tab="crew">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/><path d="M2 21a6 6 0 0 1 12 0"/><path d="M16 4a4 4 0 0 1 0 8M22 21a6 6 0 0 0-6-6"/></svg>Crew</button>
  </nav>
</div>

<!-- Sheet / modal -->
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <div class="grip"></div>
  <div class="sh-head"><h3 id="sheetTitle">Title</h3><button class="x" id="sheetX">✕</button></div>
  <div class="sh-body" id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Waterproofing+  — single-file prototype
   Data model + storage (localStorage w/ in-memory fallback)
   ============================================================ */
const CATS = [
  {id:'wp',  name:'Waterproofing', icon:'🛢️'},
  {id:'drn', name:'Drainage & Protection', icon:'🧱'},
  {id:'clk', name:'Caulking & Sealants', icon:'🧴'},
  {id:'ins', name:'Insulation', icon:'🟨'},
  {id:'inj', name:'Crack Injection', icon:'💉'},
  {id:'trf', name:'Traffic Coatings', icon:'🛣️'},
  {id:'acc', name:'Termination & Fasteners', icon:'🔩'},
  {id:'con', name:'Consumables & Prep', icon:'🧰'},
];
const SEED = {
  v: 6,
  // unit = the ONE locked unit crew logs in · step = increment (0.5 = halves allowed)
  // pack = how it's bought · perPallet + cost feed the pallet-based reorder estimate
  materials: [
    // ---- Waterproofing ----
    {id:'m1',  name:'Tremproof 260 (TP260)', cat:'wp', unit:'barrel', step:0.5, pack:'52 gal drum · 4/pallet', perPallet:4, cost:905.56, qty:6, reorder:6, bin:'Yard'},
    {id:'m2',  name:'Tremproof Amphibia (blindside)', cat:'wp', unit:'roll', step:0.5, pack:"5.91'×65.62' · 20/pallet", perPallet:20, cost:1460, qty:9, reorder:8, bin:'Rack A'},
    {id:'m3',  name:'BSWV Membrane', cat:'wp', unit:'roll', step:0.5, pack:'blind wall rolls', perPallet:0, cost:0, qty:5, reorder:6, bin:'Rack A'},

    {id:'m5',  name:'Vulkem 360 SL', cat:'wp', unit:'pail', step:1, pack:'36 pails/pallet', perPallet:36, cost:0, qty:12, reorder:8, bin:'Shelf B'},
    {id:'m6',  name:'Vulkem 950 NF', cat:'wp', unit:'pail', step:1, pack:'36 pails/pallet', perPallet:36, cost:0, qty:6, reorder:6, bin:'Shelf B'},
    {id:'m7',  name:'Vulkem 951 NF', cat:'wp', unit:'pail', step:1, pack:'36 pails/pallet', perPallet:36, cost:0, qty:4, reorder:4, bin:'Shelf B'},
    {id:'m8',  name:'191 Primer', cat:'wp', unit:'pail', step:1, pack:'', perPallet:0, cost:0, qty:8, reorder:6, bin:'Shelf B'},
    {id:'m9',  name:'Watchdog Waterproofing', cat:'wp', unit:'pail', step:1, pack:'Gablecraft', perPallet:0, cost:0, qty:5, reorder:4, bin:'Shelf C'},
    // ---- Drainage & Protection ----
    {id:'m10', name:'Tremdrain 6000 (conventional)', cat:'drn', unit:'roll', step:0.5, pack:"6'×50' · 8/pallet", perPallet:8, cost:180, qty:16, reorder:12, bin:'Rack D'},
    {id:'m11', name:'Tremdrain 6000x (blind wall)', cat:'drn', unit:'roll', step:0.5, pack:'8/pallet', perPallet:8, cost:264.26, qty:3, reorder:6, bin:'Rack D'},
    {id:'m12', name:'Tremco Drainstar (dimple)', cat:'drn', unit:'roll', step:0.5, pack:'300 sq ft/roll', perPallet:0, cost:0, qty:31, reorder:20, bin:'Rack D'},
    {id:'m13', name:'NaturaSeal Drainmat (backup)', cat:'drn', unit:'roll', step:0.5, pack:'', perPallet:0, cost:0, qty:10, reorder:6, bin:'Rack D'},
    {id:'m14', name:'Soprema G10 Drainmat', cat:'drn', unit:'roll', step:0.5, pack:'', perPallet:0, cost:0, qty:4, reorder:4, bin:'Rack D'},
    {id:'m15', name:'Delta MS Drainmat', cat:'drn', unit:'roll', step:0.5, pack:'Gablecraft', perPallet:0, cost:0, qty:6, reorder:4, bin:'Rack D'},
    {id:'m16', name:'Warm & Dri Board', cat:'drn', unit:'board', step:1, pack:'', perPallet:0, cost:0, qty:40, reorder:24, bin:'Rack E'},

let mem=null;
function hasLS(){try{const k='__t';localStorage.setItem(k,'1');localStorage.removeItem(k);return true}catch(e){return false}}
const LS=hasLS();
function load(){
  if(LS){
    try{const r=localStorage.getItem(KEY); if(r) return JSON.parse(r);}catch(e){}
  } else if(mem){ return mem; }
  return null;
}
function persist(){
  if(LS){ try{localStorage.setItem(KEY, JSON.stringify(DB));}catch(e){} }
  else { mem=DB; }
}
let DB = load();
if(!DB || DB.v !== SEED.v){ DB = JSON.parse(JSON.stringify(SEED)); seedHistory(); persist(); }

function rnd(){ return (window.__rr? window.__rr(): Math.abs(Math.sin(Date.now()))) ; }

/* ---------- date helpers (America/Vancouver-ish, uses device local) ---------- */
function todayKey(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
/* ---- recurrence period keys: task auto-resets when its period rolls over ---- */
function weekKey(){
  const d=new Date(); const day=(d.getDay()+6)%7;         // Mon=0
  const monday=new Date(d); monday.setDate(d.getDate()-day);
  return monday.getFullYear()+'-W'+String(Math.ceil(((monday-new Date(monday.getFullYear(),0,1))/86400000+1)/7)).padStart(2,'0');
}
function monthKey(){const d=new Date();return d.getFullYear()+'-M'+String(d.getMonth()+1).padStart(2,'0');}
function periodKey(freq){return freq==='weekly'?weekKey():freq==='monthly'?monthKey():todayKey();}
function taskDone(cid,task){return (DB.taskState[cid]||{})[task.id]===periodKey(task.freq);}
function dailyTasks(){return DB.truckTasks.filter(t=>t.freq==='daily');}
function myAllDailyDone(cid){return dailyTasks().every(t=>taskDone(cid,t));}

const DAY=86400000;
// battery charge state: lastCharged stored as "days ago" number in seed, or a real ts once charged
function chargeInfo(t){
  if(!t.battery) return null;
  if(t.lastCharged==null) return {k:'bad', lab:'never charged'};
  const ts = t.lastCharged>1e11 ? t.lastCharged : Date.now()-t.lastCharged*DAY; // seed uses small day-count
  const days=(Date.now()-ts)/DAY;
  if(days>=2) return {k:'bad', lab:'charge due', ago:timeAgo(ts)};
  if(days>=1) return {k:'warn', lab:'charge soon', ago:timeAgo(ts)};
  return {k:'good', lab:'charged', ago:timeAgo(ts)};
}
function chargeDueCount(){return DB.tools.filter(t=>t.battery&&(()=>{const c=chargeInfo(t);return c&&c.k==='bad';})()).length;}
function toolsOutCount(){return DB.tools.filter(t=>t.status==='out').length;}
function toolsRepairCount(){return DB.tools.filter(t=>t.condition!=='good').length;}
function timeAgo(ts){
  const s=(Date.now()-ts)/1000;
  if(s<60)return 'just now';
  if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';
  const d=Math.floor(s/86400); return d===1?'yesterday':d+'d ago';
}
function initials(n){return n.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function copyText(txt){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).catch(()=>fallbackCopy(txt)); return;
    }
  }catch(e){}
  fallbackCopy(txt);
}
function fallbackCopy(txt){
  try{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}catch(e){}
}

/* ---------- stock status ---------- */
function stockStatus(m){
  if(m.qty<=0) return {k:'bad', lab:'Out'};
  if(m.qty<m.reorder) return {k:'bad', lab:'Reorder'};
  if(m.qty<=m.reorder*1.15) return {k:'warn', lab:'Low'};
  return {k:'good', lab:'OK'};
}
function barColor(k){return k==='bad'?'var(--bad)':k==='warn'?'var(--warn)':'var(--good)';}

const TITLES={home:['Today',()=>{const d=new Date();return d.toLocaleDateString(undefined,{weekday:'long'})+' · trucks, tools & stock at a glance';}],
  inv:['Warehouse inventory',()=>'Live counts · locked units · tap to adjust'],

function go(tab){
  $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  $$('.view').forEach(v=>v.classList.remove('active'));
  $('#view-'+tab).classList.add('active');

/* delegated clicks */
document.addEventListener('click',e=>{
  const t=e.target;
  const cl=sel=>t.closest(sel);
  // tabs
  if(cl('#tabs button')){go(cl('#tabs button').dataset.tab);return;}
  if(t.dataset.go){go(t.dataset.go);return;}
  // inventory filters
  if(t.dataset.f){invFilter=t.dataset.f;renderInv();return;}
  // open material sheet
  if(cl('[data-open-mat]')){openMat(cl('[data-open-mat]').dataset.openMat);return;}
  if(t.id==='addMat'){openMatEdit(null);return;}
  if(t.id==='ordReport'){openReorder();return;}
  if(t.id==='exportPdf'){openExport();return;}
  if(t.id==='syncBt'){openBuilderTrend();return;}
  // log
  if(t.dataset.site){ if(t.dataset.site==='__new'){openSiteEdit();} else {logSite=t.dataset.site;renderLog();} return;}
  if(t.dataset.lsvc){logService=t.dataset.lsvc;renderLog();return;}
  if(t.dataset.ltype){logType=t.dataset.ltype;renderLog();return;}
  if(t.id==='addLine'){openPicker();return;}
  if(t.dataset.rm!=null){cart.splice(+t.dataset.rm,1);renderLog();return;}
  if(t.dataset.inc!=null){const i=+t.dataset.inc;const s=stepOf(mat(cart[i].mid));cart[i].qty=Math.round((cart[i].qty+s)*100)/100;renderLog();return;}
  if(t.dataset.dec!=null){const i=+t.dataset.dec;const s=stepOf(mat(cart[i].mid));cart[i].qty=Math.max(s,Math.round((cart[i].qty-s)*100)/100);renderLog();return;}
  // tools
  if(t.dataset.tf){toolFilter=t.dataset.tf;renderTools();return;}
  if(cl('[data-open-tool]')){openTool(cl('[data-open-tool]').dataset.openTool);return;}
  if(t.id==='addTool'){openToolEdit(null);return;}
  // trucks / tasks
  if(t.dataset.tsvc){trkSvc=t.dataset.tsvc;renderTrucks();return;}
  if(t.dataset.tfreq){trkFreq=t.dataset.tfreq;renderTrucks();return;}
  if(cl('[data-tt-id]')){toggleTaskId(cl('[data-tt-id]').dataset.ttId);return;}
  if(t.id==='markAllTrk'){markAllShown();return;}
  if(t.id==='truckTrip'){openTruckTrip();return;}
  if(t.id==='editTasks'){openEditTasks();return;}
  // crew
  if(t.id==='manageCrew'){openManageCrew();return;}
  if(t.id==='resetDemo'){openReset();return;}
  if(t.id==='whoBtn'){openWho();return;}
  // sheet close
  if(t.id==='sheetX'||t.id==='sheetBg'){closeSheet();return;}
});

/* ---------- truck-task logic (recurrence + points) ---------- */
function toggleTaskId(taskId){
  const task=DB.truckTasks.find(t=>t.id===taskId); if(!task) return;
  DB.taskState[DB.me]=DB.taskState[DB.me]||{};
  const pk=periodKey(task.freq);
  if(DB.taskState[DB.me][taskId]===pk) delete DB.taskState[DB.me][taskId];
  else DB.taskState[DB.me][taskId]=pk;
  checkAward();
  persist(); renderTrucks(); renderHome(); renderCrew();
}
function markAllShown(){
  const shown=DB.truckTasks.filter(t=>t.freq===trkFreq && (trkSvc==='all'||t.service===trkSvc));
  const allDone=shown.every(t=>taskDone(DB.me,t));
  DB.taskState[DB.me]=DB.taskState[DB.me]||{};
  shown.forEach(t=>{ if(allDone) delete DB.taskState[DB.me][t.id]; else DB.taskState[DB.me][t.id]=periodKey(t.freq); });
  checkAward();
  persist(); renderTrucks(); renderHome(); renderCrew();
}
function checkAward(){
  const done=myAllDailyDone(DB.me);
  const s=DB.streaks[DB.me]||{count:0,last:null};
  const awardedToday=s.awardedOn===todayKey();
  if(done&&!awardedToday){
    const m=member(DB.me); m.points+=50;
    if(s.last!==todayKey()){ s.count=(s.count||0)+1; s.last=todayKey(); if(s.count%5===0){m.points+=25;} }
    s.awardedOn=todayKey(); DB.streaks[DB.me]=s;
    celebrate(); toast('🏆 100% of daily tasks! +50 points'+(s.count%5===0?' · +25 streak bonus!':''));
  } else if(!done && awardedToday){
    member(DB.me).points=Math.max(0,member(DB.me).points-50);
    if(s.last===todayKey()){s.count=Math.max(0,s.count-1);s.last=null;}
    s.awardedOn=null; DB.streaks[DB.me]=s;
  }
}
function celebrate(){
  const c=document.createElement('div');c.className='confetti';
  const cols=['#12b3a6','#0b6ea8','#c9820a','#6b57d4','#1f9d63','#d0453b'];
  for(let i=0;i<70;i++){const p=document.createElement('i');
    p.style.left=Math.random()*100+'%';p.style.background=cols[i%cols.length];
    p.style.animationDuration=(1.6+Math.random()*1.4)+'s';p.style.animationDelay=(Math.random()*.4)+'s';
    p.style.transform='rotate('+Math.random()*360+'deg)';c.appendChild(p);}
  document.body.appendChild(c);setTimeout(()=>c.remove(),3200);
}

function openAdjust(id,type){
  const m=mat(id);
  const isSet=type==='adjust';
  openSheet((TYPE_META[type]||{}).lab||'Adjust',`
    <div class="tiny muted" style="margin-top:4px">${esc(m.name)} · currently <b>${fmtQty(m.qty)} ${m.unit}s</b> · log in ${m.unit}s</div>

    <input class="in" id="adjQty" type="number" inputmode="decimal" step="${stepOf(m)}" value="${isSet?fmtQty(m.qty):stepOf(m)}" min="0">
    ${type==='loss'?'<label class="fld">Reason</label><input class="in" id="adjNote" placeholder="e.g. torn roll, spilled pail">':''}
    <button class="btn primary block" id="adjGo" style="margin-top:16px">Confirm</button>
  `);
  $('#adjGo').onclick=()=>{
    const v=Math.max(0,Math.round((parseFloat($('#adjQty').value)||0)*100)/100);
    if(isSet){ const diff=v-m.qty; m.qty=v; logTx(id,Math.abs(diff),'adjust',null,DB.me,'set to '+v);}
    else if(type==='receive'){ m.qty+=v; logTx(id,v,'receive',null,DB.me);}
    else if(type==='loss'){ m.qty=Math.max(0,m.qty-v); logTx(id,v,'loss',null,DB.me,$('#adjNote')?.value||'');}
    persist();closeSheet();render();toast('Stock updated');
  };
}
function logTx(mid,qty,type,sid,cid,note,svcId){
  DB.tx.unshift({id:'tx'+Date.now()+Math.round(Math.random()*999),ts:Date.now(),mid,qty,type,sid:sid||null,cid:cid||null,note:note||'',svc:svcId||null});
}

let expRange=7, expSite='all';
function rangeMs(r){return r===0?Infinity:r*86400000;}
function reportRows(){
  const cut=Date.now()-rangeMs(expRange);
  return DB.tx.filter(t=>t.ts>=cut && (expSite==='all'||t.sid===expSite));
}
function reportSummary(rows){
  let usedVal=0, lossVal=0, deliverVal=0, recVal=0;
  const bySite={}, byMat={};
  rows.forEach(t=>{
    const m=mat(t.mid); const c=(m?.cost||0)*t.qty;
    if(t.type==='use') usedVal+=c;
    else if(t.type==='deliver') deliverVal+=c;
    else if(t.type==='loss') lossVal+=c;
    else if(t.type==='receive') recVal+=c;
    const sk=t.sid||'—'; bySite[sk]=bySite[sk]||{use:0,deliver:0,loss:0,val:0};
    if(['use','deliver','loss'].includes(t.type)){bySite[sk][t.type]+=t.qty;bySite[sk].val+=c;}
    if(['use','deliver','loss'].includes(t.type)){byMat[t.mid]=byMat[t.mid]||{qty:0,val:0};byMat[t.mid].qty+=t.qty;byMat[t.mid].val+=c;}
  });
  return {usedVal,lossVal,deliverVal,recVal,bySite,byMat};
}

    return `

      <div class="kpi"><div class="k-lab">Materials consumed</div><div class="k-val">${money(consumed)}</div><div class="k-sub">used + delivered</div></div>

      ${Object.keys(sum.bySite).length? Object.entries(sum.bySite).sort((a,b)=>b[1].val-a[1].val).map(([sid,d])=>`<div class="inv">
        <div class="ic">📍</div>
        <div class="mid"><div class="nm">${esc(site(sid)?site(sid).name:'No site')}</div><div class="meta">${d.use} used · ${d.deliver} delivered · ${d.loss} lost</div></div>

    <div class="tiny muted" style="text-align:center;margin-top:10px">${rows.length} transactions · report is CFO-ready with per-item cost breakdown.</div>

    $('#doCsv').onclick=copyCsv;

function copyCsv(){

    <label class="fld">Address (optional)</label><input class="in" id="sAddr" placeholder="Street, unit">
    <button class="btn primary block" id="sSave" style="margin-top:16px">Add site</button>
  `);
  $('#sSave').onclick=()=>{const n=$('#sName').value.trim();if(!n){toast('Enter a name');return;}
    const id='s'+Date.now();DB.sites.push({id,name:n,addr:$('#sAddr').value.trim()});logSite=id;persist();closeSheet();renderLog();toast('Site added');};
}

/* edit checklist tasks */
function openEditTasks(){
  const draw=()=>DB.truckTasks.map((t,i)=>`<div class="line-item" style="gap:6px">
    <input class="in" data-tt="${t.id}" value="${esc(t.text)}" style="font-size:13px;flex:1">
    <select class="in" data-tsvc2="${t.id}" style="width:74px;padding:8px 4px;font-size:12px">${DB.services.map(s=>`<option value="${s.id}" ${t.service===s.id?'selected':''}>${s.name.split(' ')[0]}</option>`).join('')}</select>
    <select class="in" data-tfr="${t.id}" style="width:70px;padding:8px 4px;font-size:12px">${['daily','weekly','monthly'].map(f=>`<option value="${f}" ${t.freq===f?'selected':''}>${f}</option>`).join('')}</select>
    <button class="btn ghost sm" data-td="${t.id}" style="padding:6px 8px">✕</button></div>`).join('');
  openSheet('Edit truck tasks',`
    <div class="tiny muted" style="margin:4px 0 8px">Each task has a <b>service</b> and a <b>reset cycle</b>. Applies to every crew member.</div>
    <div id="ttList">${draw()}</div>
    <button class="btn line block sm" id="ttAdd" style="margin-top:10px">＋ Add task</button>
    <button class="btn primary block" id="ttSave" style="margin-top:14px">Save tasks</button>
  `);
  const rebind=()=>{$$('#ttList [data-td]').forEach(b=>b.onclick=()=>{
    // persist current field edits before removing
    saveFields(); DB.truckTasks=DB.truckTasks.filter(x=>x.id!==b.dataset.td);$('#ttList').innerHTML=draw();rebind();});};
  const saveFields=()=>{
    $$('#ttList [data-tt]').forEach(inp=>{const t=DB.truckTasks.find(x=>x.id===inp.dataset.tt);if(t)t.text=inp.value.trim()||'Task';});
    $$('#ttList [data-tsvc2]').forEach(sel=>{const t=DB.truckTasks.find(x=>x.id===sel.dataset.tsvc2);if(t)t.service=sel.value;});
    $$('#ttList [data-tfr]').forEach(sel=>{const t=DB.truckTasks.find(x=>x.id===sel.dataset.tfr);if(t)t.freq=sel.value;});
  };
  rebind();
  $('#ttAdd').onclick=()=>{saveFields();DB.truckTasks.push({id:'k'+Date.now(),text:'New task',service:'veh',freq:'daily'});$('#ttList').innerHTML=draw();rebind();};
  $('#ttSave').onclick=()=>{saveFields();persist();closeSheet();renderTrucks();renderHome();toast('Tasks updated');};
}

/* ---------- tool detail + actions ---------- */
function openTool(id){
  const t=tool(id);const ch=chargeInfo(t);const out=t.status==='out';
  openSheet(t.name,`
    <div class="card" style="margin-top:4px">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="ic" style="width:52px;height:52px;border-radius:13px;background:var(--surface-2);display:grid;place-items:center;font-size:24px">${svc(t.service).icon}</div>
        <div><div style="font-weight:800;font-size:17px">${esc(t.name)}${t.battery?' 🔋':''}</div>
        <div class="tiny muted">${svc(t.service).name}${t.condition!=='good'?' · '+(t.condition==='damaged'?'Damaged':'In repair'):''}</div>
        ${out?`<div class="tiny" style="color:var(--warn);margin-top:2px">Out with ${esc(member(t.outBy)?.name||'crew')}${t.outJob?' @ '+esc(site(t.outJob)?.name||''):''}${t.outService?' · '+esc(svc(t.outService).name):''}</div>`:''}
        ${ch?`<div class="tiny" style="color:${barColor(ch.k)};margin-top:2px">🔋 ${ch.lab}${ch.ago?' · '+ch.ago:''}</div>`:''}</div>
        <span class="pill ${out?'warn':'good'}" style="margin-left:auto">${out?'Out':'In'}</span>
      </div>
      ${t.note?`<div class="tiny muted" style="margin-top:8px">📝 ${esc(t.note)}</div>`:''}
    </div>
    <label class="fld">Actions</label>
    <div class="row2">
      ${out?`<button class="btn good" data-tact="in">✅ Check in</button>`:`<button class="btn dark" data-tact="out">📤 Check out</button>`}
      ${t.battery?`<button class="btn line" data-tact="charge">🔋 Mark charged</button>`:`<button class="btn line" data-tact="none" disabled>No battery</button>`}
    </div>
    <div class="row2" style="margin-top:10px">
      ${t.condition==='good'?`<button class="btn danger" data-tact="damage">⚠️ Report damage</button><button class="btn ghost" data-tact="repair">🛠 Send to repair</button>`
        :`<button class="btn good" data-tact="fixed">✅ Back in service</button><button class="btn ghost" data-edit-tool="${id}">⚙️ Edit</button>`}
    </div>
    ${t.condition==='good'?`<button class="btn line block" data-edit-tool="${id}" style="margin-top:10px">⚙️ Edit details</button>`:''}
  `);
  $$('#sheetBody [data-tact]').forEach(b=>b.onclick=()=>toolAction(id,b.dataset.tact));
  const eb=$('#sheetBody [data-edit-tool]'); if(eb) eb.onclick=()=>openToolEdit(id);
}
function toolAction(id,act){
  const t=tool(id);
  if(act==='in'){t.status='in';t.outBy=null;t.outJob=null;t.outService=null;persist();closeSheet();render();toast('Checked in');}
  else if(act==='charge'){t.lastCharged=Date.now();persist();closeSheet();render();toast('🔋 Marked charged');}
  else if(act==='damage'){t.condition='damaged';openToolNote(id,'What\'s damaged?');}
  else if(act==='repair'){t.condition='repair';openToolNote(id,'Repair notes');}
  else if(act==='fixed'){t.condition='good';t.note='';persist();closeSheet();render();toast('Back in service');}
  else if(act==='out'){openToolCheckout(id);}
}
function openToolNote(id,label){
  const t=tool(id);
  openSheet('Flag tool',`
    <div class="tiny muted" style="margin-top:4px">${esc(t.name)}</div>
    <label class="fld">${label}</label>
    <textarea class="in" id="tNote" rows="3">${esc(t.note||'')}</textarea>
    <button class="btn primary block" id="tNoteSave" style="margin-top:14px">Save</button>
  `);
  $('#tNoteSave').onclick=()=>{t.note=$('#tNote').value.trim();persist();closeSheet();render();toast('Tool flagged');};
}
function openToolCheckout(id){
  const t=tool(id);
  let pickJob=null, pickSvc=(t.service&&t.service!=='veh')?t.service:null;
  openSheet('Check out — '+t.name,`
    <label class="fld">To which job? <span style="color:var(--bad)">*</span></label>
    <div class="selrow" id="tcoSites">${DB.sites.map(s=>`<button class="sopt" data-tco="${s.id}">${esc(s.name)}</button>`).join('')}</div>
    <label class="fld">For which service? <span style="color:var(--bad)">*</span></label>
    <div class="selrow" id="tcoSvcs">${JOB_SERVICES().map(s=>`<button class="sopt ${pickSvc===s.id?'on':''}" data-tcs="${s.id}">${s.icon} ${s.name}</button>`).join('')}</div>
    <div class="tiny muted" style="margin-top:10px">Checking out as <b>${me().name}</b>. Switch crew from the top-right avatar.</div>
    <button class="btn dark block" id="tcoGo" style="margin-top:14px" disabled>Select a job & service</button>
  `);
  const refresh=()=>{const g=$('#tcoGo');const ok=pickJob&&pickSvc;g.disabled=!ok;
    g.textContent= ok ? 'Check out · '+site(pickJob).name.split('—')[0].trim()+' · '+svc(pickSvc).name : 'Select a job & service';};
  $$('#tcoSites [data-tco]').forEach(b=>b.onclick=()=>{pickJob=b.dataset.tco;$$('#tcoSites .sopt').forEach(x=>x.classList.remove('on'));b.classList.add('on');refresh();});
  $$('#tcoSvcs [data-tcs]').forEach(b=>b.onclick=()=>{pickSvc=b.dataset.tcs;$$('#tcoSvcs .sopt').forEach(x=>x.classList.remove('on'));b.classList.add('on');refresh();});
  refresh();
  $('#tcoGo').onclick=()=>{if(!(pickJob&&pickSvc))return;t.status='out';t.outBy=DB.me;t.outJob=pickJob;t.outService=pickSvc;t.outTs=Date.now();persist();closeSheet();render();toast('Checked out · '+svc(pickSvc).name);};
}
function openToolEdit(id){
  const t=id?tool(id):{name:'',service:'veh',battery:false,status:'in',condition:'good',lastCharged:null,note:''};
  openSheet(id?'Edit tool':'New tool',`
    <label class="fld">Name</label><input class="in" id="tName" value="${esc(t.name)}" placeholder="e.g. Cordless Impact Driver">
    <label class="fld">Service</label>
    <select class="in" id="tSvc">${DB.services.map(s=>`<option value="${s.id}" ${t.service===s.id?'selected':''}>${s.icon} ${s.name}</option>`).join('')}</select>
    <label class="fld" style="display:flex;align-items:center;gap:8px;margin-top:14px"><input type="checkbox" id="tBat" ${t.battery?'checked':''} style="width:18px;height:18px"> Battery-powered (track charge)</label>
    <button class="btn primary block" id="tSave" style="margin-top:16px">${id?'Save':'Add tool'}</button>
    ${id?`<button class="btn line block" id="tDel" style="margin-top:10px;color:var(--bad)">Delete tool</button>`:''}
  `);
  $('#tSave').onclick=()=>{
    const name=$('#tName').value.trim();if(!name){toast('Enter a name');return;}
    const data={name,service:$('#tSvc').value,battery:$('#tBat').checked};
    if(!data.battery) data.lastCharged=null; else if(t.lastCharged==null) data.lastCharged=Date.now();
    if(id){Object.assign(t,data);}else{DB.tools.push({id:'t'+Date.now(),status:'in',condition:'good',lastCharged:data.battery?Date.now():null,note:'',...data});}
    persist();closeSheet();render();toast(id?'Saved':'Tool added');
  };
  const d=$('#tDel');if(d)d.onclick=()=>{DB.tools=DB.tools.filter(x=>x.id!==id);persist();closeSheet();render();toast('Deleted');};
}

/* ---------- end-of-day truck trip log ---------- */
function openTruckTrip(){
  openSheet('End-of-day truck log',`
    <label class="fld">Truck</label>
    <select class="in" id="ttrTruck">${DB.trucks.map(t=>`<option value="${t.id}">${esc(t.name)} · ${t.km.toLocaleString()} km</option>`).join('')}</select>
    <div class="row2">
      <div><label class="fld">Odometer (KM)</label><input class="in" id="ttrKm" type="number" inputmode="numeric" placeholder="current reading"></div>
      <div><label class="fld">Driver</label>
        <select class="in" id="ttrDriver">${DB.crew.map(c=>`<option value="${c.id}" ${c.id===DB.me?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
    </div>
    <label class="fld">Job visited</label>
    <select class="in" id="ttrJob"><option value="">—</option>${DB.sites.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>
    <label class="fld">Service provided</label>
    <select class="in" id="ttrSvc"><option value="">—</option>${DB.services.filter(s=>s.id!=='veh').map(s=>`<option value="${s.id}">${s.icon} ${s.name}</option>`).join('')}</select>
    <div class="row2" style="margin-top:6px">
      <label class="fld" style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="ttrOil" style="width:18px;height:18px"> Oil checked</label>
      <label class="fld" style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="ttrFuel" style="width:18px;height:18px"> Fuel topped up</label>
    </div>
    <label class="fld">Repairs / issues (optional)</label>
    <textarea class="in" id="ttrRep" rows="2" placeholder="e.g. brake noise, replace wiper"></textarea>
    <button class="btn primary block" id="ttrSave" style="margin-top:16px">Save truck log</button>
    <div class="tiny muted" style="text-align:center;margin-top:8px">Updates the truck's KM and feeds the maintenance history.</div>
  `);
  $('#ttrSave').onclick=()=>{
    const trk=truck($('#ttrTruck').value);
    const km=parseInt($('#ttrKm').value)||0;
    const log={id:'log'+Date.now(),ts:Date.now(),truckId:trk.id,km,driver:$('#ttrDriver').value,job:$('#ttrJob').value,service:$('#ttrSvc').value,
      oil:$('#ttrOil').checked,fuel:$('#ttrFuel').checked,repairs:$('#ttrRep').value.trim()};
    DB.truckLogs.unshift(log);
    if(km>trk.km) trk.km=km;
    if(log.oil) trk.lastOil=km||trk.lastOil;
    // auto-complete the matching daily vehicle tasks
    DB.taskState[DB.me]=DB.taskState[DB.me]||{};
    if(km) DB.taskState[DB.me]['k3']=todayKey();
    if(log.oil) DB.taskState[DB.me]['k1']=todayKey();
    if(log.fuel) DB.taskState[DB.me]['k2']=todayKey();
    checkAward();
    persist();closeSheet();render();toast('🚚 Truck log saved'+(log.repairs?' · repair noted':''));
  };
}

/* reset */
function openReset(){
  openSheet('Reset demo data?',`
    <div class="tiny muted" style="margin:6px 0 14px">This restores the sample warehouse, crew, and clears all logged usage &amp; points. Handy when showing the app to someone new.</div>
    <button class="btn danger block" id="rsGo">Yes, reset everything</button>
    <button class="btn ghost block" id="rsNo" style="margin-top:10px">Cancel</button>
  `);
  $('#rsGo').onclick=()=>{DB=JSON.parse(JSON.stringify(SEED));seedHistory();persist();closeSheet();render();go('home');toast('Demo data reset');};

/* ---------- floating Log button on log view submit ---------- */
function submitLog(){
  if(!cart.length){toast('Add at least one item');return;}
  if(!logSite){toast('Pick a job site first');go('log');return;}
  if(!logService){toast('Pick a service first');go('log');return;}
  cart.forEach(i=>{
    const m=mat(i.mid);if(!m)return;
    const sign=TYPE_META[logType].sign;
    if(sign<0)m.qty=Math.max(0,m.qty-i.qty);
    else if(sign>0)m.qty+=i.qty;
    logTx(i.mid,i.qty,logType,logSite,DB.me,'',logService);
  });
  const n=cart.length;cart=[];persist();render();toast(`Logged ${n} item${n>1?'s':''} · stock updated`);go('home');
}

/* floating action button that changes per view */
const fab=document.createElement('button');
fab.className='btn dark fab';fab.id='fab';
document.getElementById('app').appendChild(fab);
function updateFab(){
  const active=$('.view.active').id;
  if(active==='view-log'&&cart.length){fab.style.display='flex';fab.innerHTML=`✓ Submit log (${cart.reduce((s,i)=>s+i.qty,0)} units)`;fab.className='btn good fab';fab.onclick=submitLog;}
  else if(active==='view-inv'){fab.style.display='none';}
  else{fab.style.display='none';}
}
const _origRenderLog=renderLog;
renderLog=function(){_origRenderLog();updateFab();};
const _origGo=go;
go=function(t){_origGo(t);updateFab();};

/* boot */
render();
go('home');
updateFab();
</script>
